{% extends "base.html" %}

{% block title %}

{% block content %}

<section class="py-24">

    <div class="max-w-4xl mx-auto px-6 text-center">

        <h1 class="text-6xl font-bold">
            404

        <h2 class="text-3xl mt-6">

            Page Not Found

        </h2>

        <p class="text-gray-600 mt-4">

            Return Home

        </a>

    </div>

{% endblock %}
