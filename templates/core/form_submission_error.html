{% extends "base.html" %}
{% block title %}{{ error_title }} | Sacred Heart High School{% endblock %}
{% block robots %}noindex, nofollow, noarchive{% endblock %}
{% block content %}
<section class="soft-section py-16 md:py-24">
    <div class="mx-auto max-w-xl px-6">
        <div class="content-card rounded-3xl p-7 text-center md:p-10">
            <span class="mx-auto flex h-14 w-14 items-center justify-center rounded-full bg-amber-100 text-primary" aria-hidden="true">
                <svg class="h-7 w-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v5m0 3h.01"/></svg>
            </span>
            <h1 class="mt-6 text-3xl font-bold text-gray-900">{{ error_title }}</h1>
            <p class="mt-4 leading-7 text-gray-600">{{ error_message }}</p>
            <div class="mt-8 flex flex-wrap justify-center gap-3">
                <a href="{{ form_url }}" class="btn-primary">Open a fresh form</a>
                <a href="{% url 'contact' %}" class="inline-flex min-h-12 items-center rounded-xl border border-primary px-5 py-3 font-bold text-primary hover:bg-primary/5">Contact the school</a>
            </div>
        </div>
    </div>
</section>
{% endblock %}
