{% extends "base.html" %}

{% block title %}
{{ page.title }}
{% endblock %}

{% block content %}

<section class="max-w-5xl mx-auto px-6 py-16">

    <h1
        class="text-4xl md:text-5xl font-bold mb-8">

        {{ page.title }}

    </h1>

    {% if page.hero_image %}

        <img
            src="{{ page.hero_image.url }}"
            alt="{{ page.title }}"
            class="w-full rounded-2xl shadow-sm mb-10">

    {% endif %}

    <div class="space-y-6 text-lg leading-relaxed">

        {{ page.content|linebreaks }}

    </div>

</section>

{% endblock %}
