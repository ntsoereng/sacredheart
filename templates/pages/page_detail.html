{% extends "base.html" %}

{% block title %}
{{ page.title }}
{% endblock %}

{% block content %}

<section class="page-hero py-14 text-white"><div class="max-w-5xl mx-auto px-6"><p class="text-gold font-semibold uppercase tracking-[0.2em] text-sm">Sacred Heart High School</p><h1 class="mt-3 text-4xl font-bold md:text-5xl">{{ page.title }}</h1></div></section>
<section class="soft-section py-16 md:py-20">
<article class="content-card max-w-5xl mx-auto rounded-2xl px-7 py-9 md:px-10 md:py-12">

    {% if page.hero_image %}

        <img
            src="{{ page.hero_image.url }}"
            alt="{{ page.title }}"
            class="w-full rounded-2xl shadow-md mb-10">

    {% endif %}

    <div class="space-y-6 text-lg leading-relaxed">

        {{ page.content|linebreaks }}

    </div>
    <div class="mt-10 flex flex-wrap gap-5 border-t border-stone-200 pt-6"><a href="{% url 'about-us' %}" class="text-link">About our school →</a><a href="{% url 'contact' %}" class="text-link">Contact us →</a><a href="{% url 'application-create' %}" class="text-link">Admissions →</a></div>

</article>
</section>

{% endblock %}
