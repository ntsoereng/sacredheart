<div class="min-w-0">
    <label for="{{ field.id_for_label }}" class="mb-2 block text-sm font-bold text-gray-800">{{ field.label }}</label>
    {{ field }}
    {% if field.help_text %}<p class="mt-1 text-xs text-gray-500">{{ field.help_text }}</p>{% endif %}
    {% for error in field.errors %}<p class="mt-1 text-sm text-red-700">{{ error }}</p>{% endfor %}
</div>
