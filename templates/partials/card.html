<div
class="bg-white rounded-xl shadow-sm hover:shadow-md transition overflow-hidden">

    {% if image %}

    <img
        src="{{ image }}"
        alt="{{ title }}"
        class="w-full h-56 object-cover">

    {% endif %}

    <div class="p-6">

        {% if category %}
        <p class="text-sm text-primary font-semibold mb-2">
            {{ category }}
        </p>
        {% endif %}

        <h3 class="font-bold text-xl mb-3">
            {{ title }}
        </h3>

        <p class="text-gray-600">
            {{ excerpt }}
        </p>

        <a href="#"
           class="inline-block mt-4 text-primary font-medium">

            Read More &rarr;

        </a>

    </div>

</div>
